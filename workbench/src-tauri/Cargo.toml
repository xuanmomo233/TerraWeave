[package]
name = "terraweave"
version = "0.7.3"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
gl_generator = "0.14"
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
