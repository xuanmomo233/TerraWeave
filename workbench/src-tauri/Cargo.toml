[package]
name = "terraweave"
version = "0.7.8"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
gl_generator = "0.14"
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_DXCore", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
